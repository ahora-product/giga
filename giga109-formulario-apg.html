:root{--lime:#b6ee69;--lime-d:#9bd84c;--ink:#0c0f08;--paper:#f4f6ec;--line:#dde3cd;--mute:#5d6652}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{background:var(--paper);color:var(--ink);font:400 18px/1.45 'IT',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.fd{font-family:'FD',sans-serif;letter-spacing:-.03em}
header{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.hwrap{max-width:860px;margin:0 auto;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.hwrap img{height:30px;display:block}
.steps{display:flex;gap:7px;align-items:center}
.steps i{width:11px;height:11px;border-radius:50%;border:2px solid var(--ink);display:block;transition:.25s}
.steps i.done{background:var(--ink)}
.steps i.now{background:var(--lime);transform:scale(1.35)}
main{max-width:860px;margin:0 auto;padding:36px 24px 120px}
.screen{display:none;animation:in .4s cubic-bezier(.2,.8,.2,1)}
.screen.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.tag{font:500 13px/1 'IT';letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin-bottom:14px}
h1{font:700 clamp(40px,7vw,68px)/.98 'FD';letter-spacing:-.045em;margin-bottom:18px}
h2{font:700 clamp(28px,4.6vw,42px)/1.05 'FD';letter-spacing:-.035em;margin-bottom:10px}
.lead{font-size:20px;color:#2b3124;max-width:640px;margin-bottom:26px}
.hint{color:var(--mute);font-size:16px;margin-bottom:20px}
.num{font:700 clamp(84px,16vw,150px)/.8 'FD';letter-spacing:-.06em;margin-bottom:18px;display:flex;align-items:flex-end;gap:18px}
.num .ico{width:clamp(60px,10vw,92px);height:clamp(60px,10vw,92px);background:var(--lime);border-radius:24px;display:grid;place-items:center;margin-bottom:6px}
.num .ico svg{width:62%;height:62%;stroke:var(--ink);fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin:8px 0 20px}
.opt{position:relative;display:flex;align-items:center;gap:12px;padding:16px 18px;border:2px solid var(--line);background:#fff;border-radius:18px;cursor:pointer;font:500 17px/1.2 'IT';transition:.18s;user-select:none}
.opt:hover{border-color:var(--ink);transform:translateY(-2px)}
.opt .box{flex:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--ink);display:grid;place-items:center;background:#fff;transition:.18s}
.opt.radio .box{border-radius:50%}
.opt .box:after{content:"";width:12px;height:7px;border-left:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:rotate(-45deg) scale(0) translate(1px,-1px);transition:.18s}
.opt.radio .box:after{width:10px;height:10px;border:0;background:var(--ink);border-radius:50%;transform:scale(0)}
.opt.sel{background:var(--lime);border-color:var(--ink)}
.opt.sel .box{background:var(--lime)}
.opt.sel .box:after{transform:rotate(-45deg) scale(1) translate(1px,-1px)}
.opt.radio.sel .box:after{transform:scale(1)}
.opt input{position:absolute;opacity:0;pointer-events:none}
label.f{display:block;font:600 14px/1 'IT';letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:18px 0 8px}
input[type=text],input[type=email],textarea{width:100%;font:400 18px/1.4 'IT';padding:15px 18px;border:2px solid var(--line);border-radius:16px;background:#fff;color:var(--ink);outline:none;transition:.18s}
input:focus,textarea:focus{border-color:var(--ink);box-shadow:0 0 0 4px rgba(182,238,105,.55)}
textarea{min-height:92px;resize:vertical}
.sub{margin-top:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#fff;border:2px solid var(--line);border-radius:22px;padding:20px 22px;margin-bottom:14px}
.card h3{font:700 22px/1.1 'FD';letter-spacing:-.02em;margin-bottom:12px}
.range{margin:6px 0 4px}
.nav{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(to top,var(--paper) 70%,transparent);padding:22px 24px 22px;z-index:6}
.navin{max-width:860px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
.btn{font:700 19px/1 'FD';letter-spacing:-.01em;padding:18px 30px;border-radius:999px;border:2px solid var(--ink);background:var(--ink);color:var(--lime);cursor:pointer;transition:.18s;display:inline-flex;align-items:center;gap:10px}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 0 -2px var(--lime-d)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.lime{background:var(--lime);color:var(--ink)}
.skip{background:none;border:0;font:500 16px 'IT';color:var(--mute);text-decoration:underline;cursor:pointer;padding:10px}
.sum{display:grid;gap:10px;margin:18px 0 24px}
.sum div{background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px 18px;cursor:pointer;transition:.18s}
.sum div:hover{border-color:var(--ink)}
.sum b{font:700 15px 'FD';display:block;margin-bottom:3px}
.sum span{font-size:16px;color:#2b3124;white-space:pre-wrap}
.sum em{color:var(--mute);font-style:normal}
.acts{display:flex;flex-wrap:wrap;gap:12px;margin:10px 0 14px}
.note{font-size:15px;color:var(--mute);max-width:640px}
.hero{background:var(--lime);border-radius:36px;padding:clamp(24px,5vw,48px);margin-bottom:26px}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:12px 22px;border-radius:999px;font-weight:500;opacity:0;transition:.3s;z-index:20;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
@media(max-width:640px){.two{grid-template-columns:1fr}.btn{padding:16px 22px;font-size:17px}.hwrap img{height:24px}}
</style>
</head>

function blockHTML(q,b,i){
  var key=q.id+'_'+i, h='';
  if(b.k==='text') return '<label class="f">'+esc(b.label)+'</label><input type="text" data-text="'+key+'" placeholder="'+esc(b.ph||'')+'" value="'+esc(g(key,''))+'">';
  var cur=g(key,b.k==='multi'?[]:'');
  h+='<label class="f">'+esc(b.label)+'</label><div class="opts">';
  b.opts.forEach(function(o){ h+=optHTML(key,b.k,o,b.k==='multi'?cur.indexOf(o)>-1:cur===o); });
  if(b.other){ var ol=(typeof b.other==='string')?b.other:'Otro'; h+=optHTML(key,b.k,'__otro__',g(key+'_o_on',false)).replace('<span>__otro__</span>','<span>'+esc(ol)+'…</span>'); }
  h+='</div>';
  if(b.other){ h+='<input type="text" class="sub" data-text="'+key+'_o" placeholder="Cuéntanoslo con tus palabras" style="display:'+(g(key+'_o_on',false)?'block':'none')+'" value="'+esc(g(key+'_o',''))+'">'; }
  return h;
}
function render(){
  var id=screens[cur], h='';
  if(id==='intro'){
    h='<div class="screen on"><div class="hero"><div class="tag" style="color:#2b3124">Campaña APG Spain · Consultas</div><h1>Siete dudas antes de empezar</h1><p class="lead" style="margin-bottom:0">Gracias por vuestro tiempo. Son preguntas cortas, casi todas se contestan pulsando un botón. Tardarás unos <b>3 minutos</b>. Puedes saltar las que no sepas.</p></div>'+
      '<label class="f">Tu nombre (opcional)</label><input type="text" data-text="nombre" placeholder="Nombre y apellidos" value="'+esc(g('nombre',''))+'">'+
      '<label class="f">Tu cargo en APG (opcional)</label><input type="text" data-text="cargo" placeholder="Ej.: Junta, coordinación…" value="'+esc(g('cargo',''))+'"></div>';
  } else if(id==='fin'){
    h='<div class="screen on"><div class="tag">Último paso</div><h2>Revisa y envía</h2><p class="hint">Pulsa cualquier respuesta para cambiarla. Cuando lo tengas, dale a <b>Enviar respuestas</b> y nos llegarán directamente.</p><div class="sum" id="sum"></div>'+
      '<input type="text" id="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">'+
      '<div class="acts"><button class="btn lime" id="sendbtn" type="button">Enviar respuestas ✉</button><button class="btn ghost" id="copybtn" type="button">Copiar respuestas</button><button class="btn ghost" id="dlbtn" type="button">Descargar .txt</button></div>'+
      '<p class="note" id="sendnote">Si algo falla al enviar, pulsa «Copiar respuestas» y pégalas en un email a <b>'+esc(DESTINO)+'</b>. ¡Mil gracias!</p></div>';
  } else {
    var q=Q.filter(function(x){return x.id===id})[0], e=EXTRA.filter(function(x){return x.id===id})[0];
    if(q){
      h='<div class="screen on"><div class="tag">Duda '+('0'+q.n).slice(-2)+' de 07</div><div class="num"><span>'+('0'+q.n).slice(-2)+'</span><span class="ico"><svg viewBox="0 0 48 48">'+ICON[q.ico]+'</svg></span></div><h2>'+esc(q.title)+'</h2><p class="hint">'+esc(q.hint)+'</p>';
      q.blocks.forEach(function(b,i){h+=blockHTML(q,b,i)});
      h+='<label class="f">¿Algo más que quieras añadir? (opcional)</label><textarea data-text="'+q.id+'_c" placeholder="Escribe aquí lo que quieras…">'+esc(g(q.id+'_c',''))+'</textarea></div>';
    } else if(e.kind==='ex'){
      h='<div class="screen on"><div class="tag">Petición</div><div class="num"><span class="ico"><svg viewBox="0 0 48 48">'+ICON.user+'</svg></span></div><h2>'+esc(e.title)+'</h2><p class="hint">'+esc(e.hint)+'</p><div class="opts">'+
        ['Sí, os ponemos en contacto','Lo consultamos y os decimos','Preferimos que no'].map(function(o){return optHTML('ex_ok','single',o,g('ex_ok','')===o)}).join('')+'</div>'+
        '<div id="exf" style="display:'+(g('ex_ok','')==='Sí, os ponemos en contacto'?'block':'none')+'"><div class="card"><h3>Antiguo socio 1</h3><div class="two"><input type="text" data-text="ex1n" placeholder="Nombre" value="'+esc(g('ex1n',''))+'"><input type="text" data-text="ex1c" placeholder="Email o teléfono" value="'+esc(g('ex1c',''))+'"></div></div><div class="card"><h3>Antiguo socio 2</h3><div class="two"><input type="text" data-text="ex2n" placeholder="Nombre" value="'+esc(g('ex2n',''))+'"><input type="text" data-text="ex2c" placeholder="Email o teléfono" value="'+esc(g('ex2c',''))+'"></div></div><p class="note">Si lo prefieres, escribe aquí cómo contactarles o si hace falta avisarles antes.</p></div>'+
        '<textarea data-text="ex_c" placeholder="Comentarios (opcional)">'+esc(g('ex_c',''))+'</textarea></div>';
    } else {
      h='<div class="screen on"><div class="tag">Opcional</div><div class="num"><span class="ico"><svg viewBox="0 0 48 48">'+ICON.q+'</svg></span></div><h2>'+esc(e.title)+'</h2><p class="hint">'+esc(e.hint)+'</p>'+
        '<label class="f">¿Qué pesa más al valorar la propuesta?</label><div class="opts">'+['La idea creativa','La ejecución','Un equilibrio entre ambas','No lo sabemos'].map(function(o){return optHTML('ju_peso','single',o,g('ju_peso','')===o)}).join('')+'</div>'+
        '<label class="f">¿Qué resultado queréis medir? (altas, reactivaciones…)</label><textarea data-text="ju_c" placeholder="Opcional">'+esc(g('ju_c',''))+'</textarea></div>';
    }
  }
  app.innerHTML=h;
  bind(); chrome();
  if(id==='fin') summary();
  window.scrollTo(0,0);
}
function chrome(){
  var st=document.getElementById('steps'), h='';
  for(var i=0;i<screens.length;i++) h+='<i class="'+(i<cur?'done':(i===cur?'now':''))+'"></i>';
  st.innerHTML=h;
  var id=screens[cur];
  document.getElementById('back').style.visibility=cur===0?'hidden':'visible';
  var nx=document.getElementById('next'), sk=document.getElementById('skip');
  nx.parentNode.style.display = id==='fin'?'none':'block';
  nx.textContent = id==='intro'?'Empezar →':(cur===screens.length-2?'Revisar →':'Siguiente →');
  sk.style.display = (id==='intro'||id==='fin')?'none':'inline';
}
function bind(){
  [].forEach.call(app.querySelectorAll('.opt'),function(el){
    el.addEventListener('click',function(ev){
      ev.preventDefault();
      var key=el.dataset.key, kind=el.dataset.kind, val=el.dataset.val;
      if(val==='__otro__'){
        var on=!g(key+'_o_on',false);
        if(kind==='single'){ A[key]=''; [].forEach.call(app.querySelectorAll('.opt[data-key="'+key+'"]'),function(o){o.classList.remove('sel')}); }
        A[key+'_o_on']=on; el.classList.toggle('sel',on);
        var inp=app.querySelector('[data-text="'+key+'_o"]'); if(inp){inp.style.display=on?'block':'none'; if(on) inp.focus();}
      } else if(kind==='single'){
        if(A[key]===val){A[key]=''; el.classList.remove('sel');}
        else{ A[key]=val; A[key+'_o_on']=false; [].forEach.call(app.querySelectorAll('.opt[data-key="'+key+'"]'),function(o){o.classList.remove('sel')}); el.classList.add('sel');
          var inp2=app.querySelector('[data-text="'+key+'_o"]'); if(inp2) inp2.style.display='none'; }
        if(key==='ex_ok'){ document.getElementById('exf').style.display=(A[key]==='Sí, os ponemos en contacto')?'block':'none'; }
      } else {
        var arr=g(key,[]).slice(), i=arr.indexOf(val);
        if(i>-1) arr.splice(i,1); else arr.push(val);
        A[key]=arr; el.classList.toggle('sel');
      }
      save();
    });
  });
  [].forEach.call(app.querySelectorAll('[data-text]'),function(el){
    el.addEventListener('input',function(){A[el.dataset.text]=el.value; save();});
  });
}

/* ===== RESUMEN Y ENVÍO ===== */
function answerOf(q,b,i){
  var key=q.id+'_'+i;
  if(b.k==='text') return g(key,'');
  var o=g(key+'_o','').trim(), on=g(key+'_o_on',false);
  if(b.k==='multi'){ var a=g(key,[]).slice(); if(on&&o) a.push(o); else if(on) a.push('Otro'); return a.join(', '); }
  var v=g(key,''); if(!v&&on) v=o||'Otro'; return v;
}
function build(){
  var L=[], nm=g('nombre','').trim(), cg=g('cargo','').trim();
  L.push('RESPUESTAS A LAS 7 DUDAS · CAMPAÑA APG SPAIN');
  if(nm||cg) L.push('De: '+[nm,cg].filter(Boolean).join(' · '));
  L.push('');
  Q.forEach(function(q){
    L.push(('0'+q.n).slice(-2)+' · '+q.title);
    q.blocks.forEach(function(b,i){
      var a=answerOf(q,b,i); if(a) L.push('   '+(q.blocks.length>1?b.label.replace(/\?$/,'')+': ':'')+a);
    });
    var c=g(q.id+'_c','').trim(); if(c) L.push('   Comentario: '+c);
    if(L[L.length-1].match(/^\d\d · /)) L.push('   (sin respuesta)');
    L.push('');
  });
  var ok=g('ex_ok','');
  L.push('PETICIÓN · Dos antiguos socios');
  L.push('   '+(ok||'(sin respuesta)'));
  [1,2].forEach(function(n){ var a=g('ex'+n+'n','').trim(), b=g('ex'+n+'c','').trim(); if(a||b) L.push('   Socio '+n+': '+[a,b].filter(Boolean).join(' · ')); });
  if(g('ex_c','').trim()) L.push('   Comentario: '+g('ex_c','').trim());
  L.push('');
  if(g('ju_peso','')||g('ju_c','').trim()){ L.push('JURADO'); if(g('ju_peso','')) L.push('   Pesa más: '+g('ju_peso','')); if(g('ju_c','').trim()) L.push('   Resultados a medir: '+g('ju_c','').trim()); L.push(''); }
  L.push('— Enviado desde el formulario de GiGa109');
  return L.join('\n');
}
function summary(){
  var h='';
  Q.forEach(function(q,qi){
    var parts=[]; q.blocks.forEach(function(b,i){var a=answerOf(q,b,i); if(a) parts.push(a)});
    var c=g(q.id+'_c','').trim(); if(c) parts.push('“'+c+'”');
    h+='<div data-go="'+(qi+1)+'"><b>'+('0'+q.n).slice(-2)+' · '+esc(q.title)+'</b><span>'+(parts.length?esc(parts.join('\n')):'<em>Sin respuesta · pulsa para contestar</em>')+'</span></div>';
  });
  var ex=g('ex_ok',''); h+='<div data-go="'+(Q.length+1)+'"><b>Dos antiguos socios</b><span>'+(ex?esc(ex):'<em>Sin respuesta</em>')+'</span></div>';
  document.getElementById('sum').innerHTML=h;
  [].forEach.call(document.querySelectorAll('[data-go]'),function(d){d.addEventListener('click',function(){cur=+d.dataset.go;render()})});
  document.getElementById('sendbtn').onclick=function(){
    var btn=this, body=build();
    // Plan B: si la función no responde (p. ej. abierto en local), abrimos el programa de correo como antes.
    function porCorreo(){
      window.location.href='mailto:'+DESTINO+'?subject='+encodeURIComponent(ASUNTO)+'&body='+encodeURIComponent(body).replace(/%0A/g,'%0D%0A');
      setTimeout(function(){toast('Si no se ha abierto el correo, pulsa «Copiar respuestas»')},1800);
    }
    if(!window.fetch||location.protocol==='file:'){ porCorreo(); return; }
    btn.disabled=true; btn.textContent='Enviando…';
    fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      nombre:g('nombre','').trim(), cargo:g('cargo','').trim(), respuestas:body,
      website:(document.getElementById('hp')||{}).value||''
    })})
    .then(function(r){ return r.json().catch(function(){return {}}).then(function(j){ if(!r.ok||!j.ok) throw new Error(j.error||r.status); }); })
    .then(function(){
      btn.textContent='Enviado ✓';
      document.getElementById('sendnote').innerHTML='Hemos recibido vuestras respuestas. ¡Mil gracias!';
      toast('Respuestas enviadas');
    })
    .catch(function(){
      btn.disabled=false; btn.textContent='Enviar respuestas ✉';
      toast('No se ha podido enviar. Abriendo tu correo…');
      setTimeout(porCorreo,900);
    });
  };
  document.getElementById('copybtn').onclick=function(){
    var t=build();
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){toast('Respuestas copiadas')},fb)} else fb();
    function fb(){var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Respuestas copiadas')}catch(e){toast('No se pudo copiar')}document.body.removeChild(ta)}
  };
  document.getElementById('dlbtn').onclick=function(){
    var b=new Blob([build()],{type:'text/plain;charset=utf-8'}), a=document.createElement('a');
    a.href=URL.createObjectURL(b); a.download='respuestas-apg-giga109.txt'; document.body.appendChild(a); a.click(); document.body.removeChild(a);
  };
}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(function(){t.classList.remove('on')},2600)}

document.getElementById('next').onclick=function(){ if(cur<screens.length-1){cur++;render()} };
document.getElementById('skip').onclick=function(){ if(cur<screens.length-1){cur++;render()} };
document.getElementById('back').onclick=function(){ if(cur>0){cur--;render()} };
document.addEventListener('keydown',function(e){ if(e.key==='Enter'&&e.target.tagName!=='TEXTAREA'&&screens[cur]!=='fin'){e.preventDefault();document.getElementById('next').click()} });
render();
</script>
