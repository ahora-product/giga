<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Estudio de diseño y desarrollo. Elige proyecto: giga109 (webs y apps), menu0 (cartas digitales) y Tap & Book (reservas online)."
    />
    <title>Giga Studio — Proyectos</title>
    <link rel="canonical" href="https://www.giga109.es/hub" />

    <!-- Open Graph (WhatsApp, Telegram, redes…) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Giga109" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:url" content="https://www.giga109.es/hub" />
    <meta property="og:title" content="Giga Studio — elige el proyecto que te interesa" />
    <meta
      property="og:description"
      content="giga109 (webs y apps), menu0 (cartas digitales) y Tap & Book (reservas online)."
    />
    <meta property="og:image" content="https://www.giga109.es/assets/brand/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/jpeg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Giga Studio — Proyectos" />
    <meta name="twitter:image" content="https://www.giga109.es/assets/brand/og-image.jpg" />

    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,400;0,500;0,600;0,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles/tokens.css" />
    <link rel="stylesheet" href="hub.css" />
  </head>
  <body>
    <div class="page">
      <!-- Masthead -->
      <header class="mast">
        <span class="mast__label">Proyectos</span>
        <a
          class="mast__btn"
          href="https://wa.me/34681138782?text=Hola%20%F0%9F%91%8B%20Os%20escribo%20desde%20la%20web%2C%20me%20gustar%C3%ADa%20m%C3%A1s%20info."
          target="_blank"
          rel="noopener"
        >¿Hablamos?</a>
      </header>

      <!-- Pantalla dividida en 3 -->
      <main class="hub">
        <section class="panel" style="--acc:#b6ee69">
          <a
            class="panel__link"
            href="https://www.giga109.es/?utm_source=wa-status&utm_medium=hub"
            aria-label="Ir a giga109 — webs y apps a medida"
          ></a>
          <div class="panel__top">
            <span class="panel__square" aria-hidden="true"></span>
            <span class="panel__tag">Estudio</span>
          </div>
          <div class="panel__main">
            <h2 class="panel__name">
              <img class="panel__logo panel__logo--giga" src="../assets/logo_giga109.svg" alt="giga109" />
            </h2>
            <p class="panel__desc">Webs y apps a medida</p>
          </div>
          <span class="panel__cta">
            Ver proyecto
            <svg class="panel__arrow" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="1.6"
                stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </span>
        </section>

        <section class="panel" style="--acc:#28574B">
          <a
            class="panel__link"
            href="https://menu0.es/?utm_source=wa-status&utm_medium=hub"
            aria-label="Ir a menu0 — cartas digitales con QR"
          ></a>
          <div class="panel__top">
            <span class="panel__square" aria-hidden="true"></span>
            <span class="panel__tag">Hostelería</span>
          </div>
          <div class="panel__main">
            <h2 class="panel__name">
              <img class="panel__logo panel__logo--menu" src="../assets/logo_menu0.svg" alt="menu0" />
            </h2>
            <p class="panel__desc">Cartas digitales con QR</p>
          </div>
          <span class="panel__cta">
            Ver proyecto
            <svg class="panel__arrow" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="1.6"
                stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </span>
        </section>

        <section class="panel" style="--acc:#892734">
          <a
            class="panel__link"
            href="https://www.tap-and-book.com/?utm_source=wa-status&utm_medium=hub"
            aria-label="Ir a Tap and Book — reservas online para tu negocio"
          ></a>
          <div class="panel__top">
            <span class="panel__square" aria-hidden="true"></span>
            <span class="panel__tag">Reservas</span>
          </div>
          <div class="panel__main">
            <h2 class="panel__name">
              <img class="panel__logo panel__logo--tab" src="../assets/logo_Tap%26Book.svg" alt="Tap & Book" />
            </h2>
            <p class="panel__desc">Reservas online para tu negocio</p>
          </div>
          <span class="panel__cta">
            Ver proyecto
            <svg class="panel__arrow" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="1.6"
                stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </span>
        </section>
      </main>
    </div>

    <!-- Cursor personalizado: cuadrado redondeado, color por proyecto -->
    <div class="cursor" aria-hidden="true" data-cursor>
      <span class="cursor__dot"></span>
    </div>

    <script src="hub.js" defer></script>
  </body>
</html>
